protocols = imap pop3
mail_location = maildir:~/Maildir
ssl = no
disable_plaintext_auth = no
mail_privileged_group = mail
first_valid_uid = 1000
namespace inbox {
  inbox = yes
  separator = /
}
passdb {
  driver = passwd-file
  args = /etc/userdb/passwd
}
userdb {
  driver = passwd-file
  args = /etc/userdb/passwd
}
