[package]
name = "mail_cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prettytable-rs = "0.10" # Para dibujar la tabla
ratatui = "0.26"
crossterm = "0.27" # Para manejar eventos de teclado y terminal